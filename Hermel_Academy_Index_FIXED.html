<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <style>
    :root{--bg:#0d0e11;--panel:#17191f;--panel2:#202229;--line:#30323a;--gold:#e7c46c;--muted:#a9abb4;--white:#f6f6f7;--red:#f07373;--green:#77d5a3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--gold);color:#17130a}
    button.secondary{background:var(--panel2);color:var(--white);border:1px solid var(--line)}button.danger{background:#48282a;color:#ffd8d8}button:disabled{opacity:.5}
    input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#101116;color:var(--white);outline:none}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}h1,h2,h3,p{margin-top:0}h2{font-size:20px;margin-bottom:14px}small,.muted{color:var(--muted)}.hidden{display:none!important}
    .wrap{max-width:980px;margin:auto;padding:16px 14px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 18px}
    .brand{display:flex;align-items:center;gap:11px}.crest{width:45px;height:48px;display:grid;place-items:center;border:1px solid #7b6435;border-radius:14px;color:var(--gold);font-size:24px;background:linear-gradient(145deg,#29241a,#101114)}
    .brandname{font-size:16px;font-weight:900;letter-spacing:1.4px}.tagline{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:3px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin-bottom:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5}.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 13px;border-radius:12px}.tab.active{background:#352e1d;color:var(--gold);border-color:#7c6738}
    .stat{background:var(--panel2);padding:13px;border-radius:13px}.stat b{display:block;font-size:23px;color:var(--gold)}.stat span{font-size:12px;color:var(--muted)}
    .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px}.playercard{border-radius:17px;padding:13px;position:relative;overflow:hidden;min-height:250px;border:1px solid #96714b;background:radial-gradient(ellipse at top,#62432d,#30241c 55%,#1d1815);color:#f8dfbd}
    .playercard.rare{border-color:#66b8ff;background:radial-gradient(ellipse at top,#185a91,#14304c 60%,#111923);color:#d5edff}.playercard.legendary{border-color:#ffe49a;background:radial-gradient(ellipse at top,#947126,#4c3912 60%,#201a0e);color:#fff0bd}
    .cardtop{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:1px}.ovr{font-size:30px;font-weight:950;line-height:1.1}.pos{font-size:12px}.portrait{height:76px;display:grid;place-items:center;margin:8px auto 5px;color:inherit;font-size:48px}.portrait img{max-height:78px;max-width:90px;object-fit:contain}.pname{text-align:center;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid currentColor;padding-bottom:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:9px;font-size:11px;font-weight:800}.stats span{display:flex;justify-content:space-between;gap:4px}.product{background:var(--panel2);border:1px solid var(--line);border-radius:15px;overflow:hidden}.productimg{height:115px;background:#131419;display:grid;place-items:center;color:var(--gold);font-size:40px}.productimg img{width:100%;height:100%;object-fit:cover}.productbody{padding:12px}.pill{font-size:11px;padding:4px 8px;border-radius:30px;background:#2b2b2f;color:var(--muted);display:inline-block}.pill.gold{background:#3a321e;color:var(--gold)}.listitem{padding:12px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border-bottom:0}.msg{padding:11px 13px;border-radius:12px;background:#2d2820;color:var(--gold);margin-bottom:12px}.error{background:#402326;color:#ffc3c3}.success{background:#18372b;color:#a6f0c5}.empty{text-align:center;padding:24px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:end center;z-index:20;padding:10px}.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.foot{color:#656772;text-align:center;font-size:11px;margin:24px 0 0}
    @media(min-width:650px){.wrap{padding:24px 20px 40px}.modalback{place-items:center}.playercard{min-height:280px}.portrait{height:92px}.portrait img{max-height:90px}.grid.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="crest">⚽</div><div><div class="brandname">HERMEL ACADEMY</div><div class="tagline">FOOTBALL • DISCIPLINE • EXCELLENCE</div></div></div>
    <button id="logoutBtn" class="secondary hidden" onclick="logout()">خروج</button>
  </header>
  <section id="loginView" class="panel">
    <h2>دخول الأكاديمية</h2><p class="muted">سجّل الدخول بحسابك وكلمة المرور الخاصة بك.</p>
    <div id="loginMsg"></div>
    <form id="loginForm">
      <div class="field"><label>اسم المستخدم</label><input id="loginUsername" autocomplete="username" required maxlength="40"></div>
      <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button style="width:100%" type="submit">تسجيل الدخول</button>
    </form>
    <p class="foot">Hermel Academy • Player Portal</p>
  </section>
  <section id="appView" class="hidden">
    <div id="mustChange" class="panel hidden"><h2>تغيير كلمة المرور</h2><p class="muted">لأمان حسابك، يجب تغيير كلمة المرور المؤقتة قبل المتابعة.</p><form id="passwordForm"><div class="field"><label>كلمة المرور الحالية</label><input id="oldPassword" type="password" required></div><div class="field"><label>كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="newPassword" type="password" minlength="10" required></div><button>حفظ كلمة المرور</button></form></div>
    <div id="welcome" class="panel row between"><div><div class="muted" id="roleLabel">مرحبًا</div><h2 id="welcomeName" style="margin:4px 0">Hermel Academy</h2></div><div class="crest">HA</div></div>
    <div id="tabs" class="tabs"></div>
    <div id="main"></div>
  </section>
</div>
<div id="modalRoot"></div>
<script>
let TOKEN='', ME=null, DATA=null, TAB='home', EDIT_PLAYER=null, EDIT_PRODUCT=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isStaff=()=>ME&&['admin','assistant'].includes(ME.role);
const call=(fn,...args)=>new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));if(fn==='apiLogin')runner[fn](...args);else runner[fn](TOKEN,...args);});
function showMsg(id,msg,type=''){ $(id).innerHTML=msg?`<div class="msg ${type}">${esc(msg)}</div>`:''; }
function setToken(t){TOKEN=t; try{sessionStorage.setItem('ha_token',t)}catch(e){}}
function init(){ $('loginForm').addEventListener('submit',login); $('passwordForm').addEventListener('submit',changePassword); try{const t=sessionStorage.getItem('ha_token');if(t){TOKEN=t;call('apiGetData').then(d=>{DATA=d;ME=d.user;showApp()}).catch(()=>{TOKEN='';sessionStorage.removeItem('ha_token')})}}catch(e){} }
async function login(e){e.preventDefault();showMsg('loginMsg','');try{const r=await call('apiLogin',$('loginUsername').value,$('loginPassword').value);setToken(r.token);ME=r.user;DATA=r.data;showApp()}catch(err){showMsg('loginMsg',err.message,'error')}}
function showApp(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('welcomeName').textContent=ME.username;$('roleLabel').textContent=({admin:'المدرب الرئيسي',assistant:'مساعد المدرب',player:'ملف اللاعب'})[ME.role]||'الأكاديمية';$('mustChange').classList.toggle('hidden',!ME.mustChangePassword);buildTabs();render(); }
async function logout(){try{await call('apiLogout')}catch(e){}TOKEN='';ME=null;DATA=null;try{sessionStorage.removeItem('ha_token')}catch(e){}$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('logoutBtn').classList.add('hidden');showMsg('loginMsg','تم تسجيل الخروج.')}
async function changePassword(e){e.preventDefault();try{const r=await call('apiChangePassword',$('oldPassword').value,$('newPassword').value);ME=r.user;$('oldPassword').value='';$('newPassword').value='';$('mustChange').classList.add('hidden');showMsg('loginMsg','');await refresh();alert('تم تغيير كلمة المرور بنجاح.')}catch(err){alert(err.message)}}
async function refresh(){try{DATA=await call('apiGetData');ME=DATA.user;buildTabs();render()}catch(e){alert(e.message);if(e.message.includes('Session'))logout()}}
function buildTabs(){const items=ME.role==='player'?[['home','بطاقتي'],['shop','المتجر'],['orders','طلباتي']]:[['home','لوحة التحكم'],['players','اللاعبون'],['shop','المتجر'],['orders','الطلبات'],['accounts','الحسابات']];$('tabs').innerHTML=items.map(([k,n])=>`<button class="tab ${TAB===k?'active':''}" onclick="TAB='${k}';render();buildTabs()">${n}</button>`).join('')}
function render(){if(ME.mustChangePassword){$('main').innerHTML='<div class="panel muted">غيّر كلمة المرور أعلاه للمتابعة.</div>';return}const f={home:homeView,players:playersView,shop:shopView,orders:ordersView,accounts:accountsView};$('main').innerHTML=(f[TAB]||homeView)()}
function homeView(){if(ME.role==='player'){const p=DATA.players[0];return p?`<h2>بطاقتي</h2><div class="cardgrid">${playerCard(p)}</div><div class="grid" style="margin-top:14px"><div class="stat"><b>${esc(p.points||0)}</b><span>نقاط تحفيزية</span></div><div class="stat"><b>#${rankOf(p)}</b><span>ترتيبك بالنقاط</span></div></div>`:'<div class="panel empty">لم يتم ربط حسابك بملف لاعب بعد. راجع المدرب.'}
return `<div class="grid"><div class="stat"><b>${DATA.stats.players}</b><span>لاعب نشط</span></div><div class="stat"><b>${DATA.stats.products}</b><span>منتج متاح</span></div><div class="stat"><b>${DATA.stats.orders}</b><span>طلب مسجل</span></div><div class="stat"><b>${DATA.players.filter(p=>Number(p.overall)>=85).length}</b><span>لاعب أسطوري</span></div></div><div class="panel" style="margin-top:14px"><div class="row between"><h2>أفضل اللاعبين بالنقاط</h2><button class="secondary" onclick="TAB='players';render();buildTabs()">عرض الكل</button></div>${[...DATA.players].sort((a,b)=>Number(b.points)-Number(a.points)).slice(0,5).map((p,i)=>`<div class="listitem row between"><div><b>${i+1}. ${esc(p.name)}</b><div class="muted">${esc(p.position)} • تقييم ${p.overall}</div></div><span class="pill gold">${p.points} نقطة</span></div>`).join('')||'<div class="empty">أضف أول لاعب للبدء.</div>'}</div>`}
function rankOf(p){return [...DATA.players].sort((a,b)=>Number(b.points)-Number(a.points)).findIndex(x=>x.playerId===p.playerId)+1}
function playerCard(p){const rarity=String(p.rarity||'bronze');const cls=rarity==='legendary'?'legendary':rarity==='rare'?'rare':'';const label=rarity==='legendary'?'LEGENDARY':rarity==='rare'?'RARE':'BRONZE';const portrait=p.photoUrl?`<img src="${esc(p.photoUrl)}" alt="صورة اللاعب" onerror="this.style.display='none'">`:'⚽';return `<article class="playercard ${cls}"><div class="cardtop"><span>${label}</span><span>HERMEL FC</span></div><div class="row" style="align-items:flex-start;gap:8px;margin-top:8px"><div><div class="ovr">${esc(p.overall||0)}</div><div class="pos">${esc(p.position||'MF')}</div></div><div class="portrait" style="flex:1;margin:0">${portrait}</div></div><div class="pname">${esc(p.name)}</div><div class="stats"><span>PAC <b>${esc(p.pac)}</b></span><span>SHO <b>${esc(p.sho)}</b></span><span>PAS <b>${esc(p.pas)}</b></span><span>DRI <b>${esc(p.dri)}</b></span><span>DEF <b>${esc(p.def)}</b></span><span>PHY <b>${esc(p.phy)}</b></span></div><div style="text-align:center;font-size:10px;margin-top:8px">⭐ ${esc(p.points||0)} POINTS ${p.shirtNumber?'• #'+esc(p.shirtNumber):''}</div>${isStaff()?`<div class="actions" style="margin-top:10px"><button class="secondary" onclick="editPlayer('${esc(p.playerId)}')">تعديل</button><button class="danger" onclick="deactivatePlayer('${esc(p.playerId)}')">تعطيل</button></div>`:''}</article>`}
function playersView(){const sorted=[...DATA.players].sort((a,b)=>Number(b.points)-Number(a.points));return `<div class="row between"><h2>قائمة اللاعبين</h2>${isStaff()?'<button onclick="editPlayer()">+ لاعب</button>':''}</div><div class="field"><label>ترتيب النقاط</label><select id="sortPlayers" onchange="sortPlayersUI()"><option value="desc">الأعلى نقاطًا أولًا</option><option value="asc">الأقل نقاطًا أولًا</option><option value="overall">أعلى تقييم إجمالي</option><option value="name">الاسم</option></select></div><div id="playersGrid" class="cardgrid">${sorted.map(playerCard).join('')||'<div class="empty">لا يوجد لاعبون بعد.</div>'}</div>`}
function sortPlayersUI(){const s=$('sortPlayers').value;let ps=[...DATA.players];if(s==='asc')ps.sort((a,b)=>Number(a.points)-Number(b.points));else if(s==='overall')ps.sort((a,b)=>Number(b.overall)-Number(a.overall));else if(s==='name')ps.sort((a,b)=>String(a.name).localeCompare(String(b.name)));else ps.sort((a,b)=>Number(b.points)-Number(a.points));$('playersGrid').innerHTML=ps.map(playerCard).join('')}
function shopView(){return `<div class="row between"><h2>متجر الأكاديمية</h2>${isStaff()?'<button onclick="editProduct()">+ منتج</button>':''}</div><div class="cardgrid">${DATA.products.map(p=>`<div class="product"><div class="productimg">${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" onerror="this.style.display='none'">`:'⚽'}</div><div class="productbody"><b>${esc(p.name)}</b><p class="muted" style="font-size:12px;margin:6px 0">${esc(p.description||'')}</p><div class="row between"><span class="pill gold">${Number(p.pointsCost)>0?esc(p.pointsCost)+' نقطة': '$'+Number(p.priceUSD||0).toFixed(2)}</span><span class="muted">المخزون: ${esc(p.stock)}</span></div>${ME.role==='player'?`<div class="field" style="margin-top:10px"><label>الكمية</label><select id="qty_${esc(p.productId)}"><option>1</option><option>2</option><option>3</option></select></div><button style="width:100%" onclick="placeOrder('${esc(p.productId)}')">اطلب الآن</button>`:''}${isStaff()?`<div class="actions" style="margin-top:10px"><button class="secondary" onclick="editProduct('${esc(p.productId)}')">تعديل</button><button class="danger" onclick="deactivateProduct('${esc(p.productId)}')">إخفاء</button></div>`:''}</div></div>`).join('')||'<div class="empty">المتجر فارغ حاليًا.</div>'}</div>`}
function ordersView(){const orders=ME.role==='player'?DATA.orders:[...DATA.orders].reverse();return `<h2>${ME.role==='player'?'طلباتي':'طلبات اللاعبين'}</h2>${orders.map(o=>`<div class="panel"><div class="row between"><b>${esc(o.productName)}</b><span class="pill ${o.status==='Delivered'?'gold':''}">${statusAr(o.status)}</span></div><div class="muted" style="margin:7px 0">${esc(o.playerName)} • كمية ${esc(o.quantity)} • ${new Date(o.createdAt).toLocaleDateString()}</div>${isStaff()?`<div class="row"><select id="status_${esc(o.orderId)}"><option value="Pending" ${o.status==='Pending'?'selected':''}>قيد المراجعة</option><option value="Approved" ${o.status==='Approved'?'selected':''}>مقبول</option><option value="Rejected" ${o.status==='Rejected'?'selected':''}>مرفوض</option><option value="Delivered" ${o.status==='Delivered'?'selected':''}>تم التسليم</option></select><button onclick="updateOrder('${esc(o.orderId)}')">حفظ</button></div>`:''}</div>`).join('')||'<div class="panel empty">لا توجد طلبات بعد.</div>'}`}
function statusAr(s){return ({Pending:'قيد المراجعة',Approved:'مقبول',Rejected:'مرفوض',Delivered:'تم التسليم'})[s]||s}
function accountsView(){return `<div class="row between"><h2>الحسابات</h2><button onclick="newAccount()">+ حساب</button></div><div class="panel"><p class="muted">أنشئ حساب لاعب مرتبطًا بملفه، أو حساب مساعد مدرب. الحسابات الجديدة يجب أن تغيّر كلمة المرور عند أول دخول.</p>${DATA.accounts.map(a=>`<div class="listitem"><div class="row between"><div><b>${esc(a.username)}</b><div class="muted">${a.role==='admin'?'مدرب رئيسي':a.role==='assistant'?'مساعد مدرب':'لاعب'} ${a.active?'':'• معطّل'}</div></div><button class="secondary" onclick="resetPassword('${esc(a.userId)}','${esc(a.username)}')">إعادة تعيين كلمة المرور</button></div></div>`).join('')}</div>`}
function modal(content){$('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between"><h2>Hermel Academy</h2><button class="secondary" onclick="closeModal()">✕</button></div>${content}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function editPlayer(id){const p=DATA.players.find(x=>x.playerId===id)||{name:'',position:'MF',shirtNumber:0,photoUrl:'',points:0,pac:50,sho:50,pas:50,dri:50,def:50,phy:50,notes:''};EDIT_PLAYER=p;modal(`<h2>${id?'تعديل لاعب':'إضافة لاعب'}</h2><form id="playerForm"><input type="hidden" name="playerId" value="${esc(p.playerId||'')}"><div class="grid formgrid">${field('name','اسم اللاعب',p.name,'text',true)}<div class="field"><label>المركز</label><select name="position"><option ${p.position==='GK'?'selected':''}>GK</option><option ${p.position==='DF'?'selected':''}>DF</option><option ${p.position==='MF'?'selected':''}>MF</option><option ${p.position==='FW'?'selected':''}>FW</option></select></div>${field('shirtNumber','رقم القميص',p.shirtNumber,'number')}${field('photoUrl','رابط صورة https',p.photoUrl)}${field('points','النقاط التحفيزية',p.points,'number')}${['pac','sho','pas','dri','def','phy'].map(k=>field(k,({pac:'السرعة PAC',sho:'التسديد SHO',pas:'التمرير PAS',dri:'المراوغة DRI',def:'الدفاع DEF',phy:'القوة البدنية PHY'})[k],p[k],'number')).join('')}</div><div class="field"><label>ملاحظات</label><textarea name="notes">${esc(p.notes||'')}</textarea></div><button style="width:100%">حفظ اللاعب</button></form>`);$('playerForm').onsubmit=savePlayer}
function field(name,label,value,type='text',required=false){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value??'')}" ${required?'required':''} ${type==='number'?'min="0"':''}></div>`}
async function savePlayer(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());['shirtNumber','points','pac','sho','pas','dri','def','phy'].forEach(k=>obj[k]=Number(obj[k]||0));try{DATA=await call('apiAdminSavePlayer',obj);ME=DATA.user;closeModal();TAB='players';buildTabs();render()}catch(err){alert(err.message)}}
async function deactivatePlayer(id){if(!confirm('تعطيل اللاعب وحسابه؟'))return;try{DATA=await call('apiAdminDeletePlayer',id);render()}catch(e){alert(e.message)}}
function editProduct(id){const p=DATA.products.find(x=>x.productId===id)||{name:'',description:'',imageUrl:'',priceUSD:0,pointsCost:0,stock:1};modal(`<h2>${id?'تعديل منتج':'إضافة منتج'}</h2><form id="productForm"><input type="hidden" name="productId" value="${esc(p.productId||'')}">${field('name','اسم المنتج',p.name,'text',true)}${field('description','الوصف',p.description)}${field('imageUrl','رابط صورة https',p.imageUrl)}<div class="grid">${field('priceUSD','السعر بالدولار',p.priceUSD,'number')}${field('pointsCost','النقاط المطلوبة (0 إذا بالدولار)',p.pointsCost,'number')}${field('stock','الكمية بالمخزون',p.stock,'number')}</div><button style="width:100%">حفظ المنتج</button></form>`);$('productForm').onsubmit=saveProduct}
async function saveProduct(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());['priceUSD','pointsCost','stock'].forEach(k=>obj[k]=Number(obj[k]||0));try{DATA=await call('apiAdminSaveProduct',obj);ME=DATA.user;closeModal();TAB='shop';buildTabs();render()}catch(err){alert(err.message)}}
async function deactivateProduct(id){if(!confirm('إخفاء هذا المنتج من المتجر؟'))return;try{DATA=await call('apiAdminDeleteProduct',id);render()}catch(e){alert(e.message)}}
async function placeOrder(id){const qty=Number($('qty_'+id).value||1);if(!confirm('تأكيد إرسال الطلب؟ إذا كان المنتج بالنقاط فسيتم خصم النقاط عند التسجيل.'))return;try{DATA=await call('apiPlaceOrder',id,qty);ME=DATA.user;alert('تم تسجيل الطلب.');TAB='orders';buildTabs();render()}catch(e){alert(e.message)}}
async function updateOrder(id){try{DATA=await call('apiAdminUpdateOrder',id,$('status_'+id).value);render()}catch(e){alert(e.message)}}
function newAccount(){const players=DATA.players.filter(p=>!DATA.accounts.some(a=>a.playerId===p.playerId&&a.active));modal(`<h2>إنشاء حساب</h2><form id="accountForm"><div class="field"><label>نوع الحساب</label><select name="role" id="accountRole" onchange="togglePlayerField()"><option value="player">لاعب</option><option value="assistant">مساعد مدرب</option></select></div><div class="field"><label>اسم المستخدم (3 أحرف على الأقل)</label><input name="username" required minlength="3" pattern="[A-Za-z0-9._-]+" autocomplete="off"></div><div class="field"><label>كلمة مرور مؤقتة (10 أحرف على الأقل)</label><input name="password" type="password" required minlength="10" autocomplete="new-password"></div><div class="field" id="accountPlayerField"><label>ربط بملف اللاعب</label><select name="playerId" id="accountPlayer">${players.map(p=>`<option value="${esc(p.playerId)}">${esc(p.name)} (${esc(p.position)})</option>`).join('')}</select>${players.length?'':'<small>يجب إضافة لاعب أولًا أو التأكد من عدم وجود حساب مرتبط به.</small>'}</div><button style="width:100%">إنشاء الحساب</button></form>`);$('accountForm').onsubmit=createAccount}
function togglePlayerField(){$('accountPlayerField').classList.toggle('hidden',$('accountRole').value!=='player')}
async function createAccount(e){e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());try{DATA=await call('apiAdminCreateAccount',obj);ME=DATA.user;closeModal();TAB='accounts';buildTabs();render();alert('تم إنشاء الحساب. أعطِ المستخدم كلمة المرور المؤقتة واطلب منه تغييرها.')}catch(err){alert(err.message)}}
function resetPassword(id,username){modal(`<h2>إعادة تعيين كلمة المرور</h2><p class="muted">الحساب: ${esc(username)}. سيُطلب من المستخدم تغيير كلمة المرور عند الدخول.</p><form id="resetForm"><div class="field"><label>كلمة المرور المؤقتة الجديدة</label><input name="password" type="password" minlength="10" required></div><button style="width:100%">تعيين كلمة المرور</button></form>`);$('resetForm').onsubmit=async e=>{e.preventDefault();const pw=new FormData(e.target).get('password');try{await call('apiAdminResetPassword',id,pw);closeModal();alert('تمت إعادة تعيين كلمة المرور.')}catch(err){alert(err.message)}}}
init();
</script>
</body>
</html>
